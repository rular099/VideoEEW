[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videoeew"
version = "0.1.0"
description = "Auditable CoTracker3 video-motion pipeline for empirical coarse PGA estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
pc = [
  "opencv-python-headless>=4.8",
  "pandas>=2.0",
  "psutil>=5.9",
  "scikit-learn>=1.3",
  "torch>=2.1",
]
seismic = ["obspy>=1.4"]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
videoeew = "seismic_motion.cli.run:main"

[tool.setuptools.packages.find]
include = ["seismic_motion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

